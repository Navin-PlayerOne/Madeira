name: Build Madeira IPA

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Xcode Build Configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install System Dependencies
        run: |
          brew install sevenzip cmake ninja bison flex llvm ccache
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH

      - name: Refresh Bundled License Files
        run: |
          chmod +x build/stage-licenses.sh
          ./build/stage-licenses.sh

      - name: Download and Extract MSVC x86_64 Runtimes
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          curl -L "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o vc_redist.x64.exe
          7zz x vc_redist.x64.exe -o/tmp/vcredist -y
          # Extract all required runtime DLLs from installer cabinet
          find /tmp/vcredist -name "*.cab" -exec 7zz e {} -oapp/Madeira/x86_64-vcruntime/ -y \; || true
          7zz e /tmp/vcredist -oapp/Madeira/x86_64-vcruntime/ concrt140.dll msvcp140*.dll vcamp140.dll vccorlib140.dll vcomp140.dll vcruntime140*.dll -r -y || true
          echo "MSVC runtime files in app/Madeira/x86_64-vcruntime/:"
          ls -la app/Madeira/x86_64-vcruntime/

      - name: Install llvm-mingw Toolchain
        run: |
          mkdir -p toolchains
          if [ ! -d "toolchains/llvm-mingw-20260922-ucrt-macos-universal" ]; then
            echo "Downloading llvm-mingw..."
            curl -L "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-macos-universal.tar.xz" -o /tmp/llvm-mingw.tar.xz
            tar -xJ -C toolchains -f /tmp/llvm-mingw.tar.xz
          fi
          LLVM_DIR=$(find toolchains -maxdepth 1 -name "llvm-mingw-*-ucrt-macos-universal" | head -n 1)
          # Symlink to the pinned directory name referenced by Madeira build scripts
          ln -sfn "$(basename "$LLVM_DIR")" toolchains/llvm-mingw-20260421-ucrt-macos-universal
          echo "$(pwd)/$LLVM_DIR/bin" >> $GITHUB_PATH
          echo "llvm-mingw ready at $LLVM_DIR"

      - name: Cache LLVM 15 iOS Toolchain
        id: cache-llvm-ios
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
            toolchains/llvm-project
          key: llvm-15-ios-host-target-${{ runner.os }}-v4

      - name: Build LLVM 15 for iOS (if not cached)
        if: steps.cache-llvm-ios.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          cd toolchains
          if [ ! -d "llvm-project" ]; then
            git clone --depth 1 --branch llvmorg-15.0.7 https://github.com/llvm/llvm-project.git
          fi
          
          # Patch AddLLVM.cmake cleanly via Python to enable -dead_strip on iOS
          python3 -c '
          path = "llvm-project/llvm/cmake/modules/AddLLVM.cmake"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("MATCHES \"Darwin\"", "MATCHES \"Darwin|iOS\"")
          with open(path, "w") as f:
              f.write(content)
          print("Patched AddLLVM.cmake successfully")
          '

          # 1. Build host llvm-tblgen
          mkdir -p llvm-host-build
          cmake -S llvm-project/llvm -B llvm-host-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF
          cmake --build llvm-host-build --target llvm-tblgen -j$(sysctl -n hw.ncpu)

          # 2. Cross-compile LLVM IR static libraries for iOS
          mkdir -p llvm-ios-build
          cmake -S llvm-project/llvm -B llvm-ios-build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TABLEGEN="$(pwd)/llvm-host-build/bin/llvm-tblgen" \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_TARGET_ARCH=host \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_TOOL_LTO_BUILD=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS=""
          # Build only the static libraries needed (avoiding unneeded dylibs / tools)
          cmake --build llvm-ios-build --target llvm-libraries -j$(sysctl -n hw.ncpu)
          cd ..

      - name: Build FreeType for iOS
        run: |
          mkdir -p research
          if [ ! -d "research/freetype" ]; then
            git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          fi
          chmod +x build/freetype-ios/build.sh
          ./build/freetype-ios/build.sh

      - name: Build Wine macOS Configuration and Headers
        run: |
          cd wine
          # Create stub for missing arm64ec_x64_export_iat.c to satisfy Wine's makedep
          cat << 'EOF' > dlls/ntdll/arm64ec_x64_export_iat.c
          /* arm64ec_x64_export_iat.c stub */
          #ifndef ARM64EC_X64_EXPORT_IAT_H
          #define ARM64EC_X64_EXPORT_IAT_H

          static inline BOOL arm64ec_iat_slot_is_x64_export( HMODULE module, ULONG size_of_image, ULONG_PTR slot_rva,
                                                             ULONG_PTR exports_rva, ULONG export_size,
                                                             const void *code_map, ULONG code_map_count )
          {
              return FALSE;
          }

          #endif
          EOF

          # Patch makedep.c cleanly via Python to avoid fatal error on header ordering
          python3 -c '
          import re
          path = "tools/makedep.c"
          with open(path, "r") as f:
              content = f.read()
          content = re.sub(r"fatal_error\(\s*\"%s must be included before other headers",
                           r"fprintf( stderr, \"%s must be included before other headers",
                           content)
          with open(path, "w") as f:
              f.write(content)
          print("Patched makedep.c successfully")
          '

          mkdir -p build-macos
          cd build-macos
          ../configure --without-x --without-freetype --disable-tests
          make -j$(sysctl -n hw.ncpu) tools __tooldeps__ include || true
          cd ..
          ln -sfn build-macos build-arm64ec
          cd ..

      - name: Build wineserver Unix Library for iOS
        run: |
          # Inject socket headers into config_ios.h and fd_ios.c
          printf "\n#include <sys/socket.h>\n#include <netinet/in.h>\n" >> build/wineserver/config_ios.h
          python3 -c '
          path = "build/wineserver/fd_ios.c"
          with open(path, "r") as f:
              content = f.read()
          if "<sys/socket.h>" not in content:
              with open(path, "w") as f:
                  f.write("#include <sys/socket.h>\n#include <netinet/in.h>\n" + content)
          print("Injected socket headers into fd_ios.c")
          '

          mkdir -p build/wineserver/obj
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Compile base libwineserver objects if app archive is not yet present
          if [ ! -f "app/Madeira/libwineserver.a" ]; then
            echo "Compiling base libwineserver objects..."
            for f in wine/server/*.c; do
              name=$(basename "$f" .c)
              xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK_PATH" \
                -miphoneos-version-min=17.0 -O2 \
                -Iwine/include -Iwine/include/wine -Iwine/build-macos/include \
                -Ibuild/wineserver -Iwine/server -Ibuild/ntdll-unix/shims \
                -Ibuild/madsync -DHAVE_LINUX_NTSYNC_H=1 \
                -include build/wineserver/config_ios.h -include stdarg.h \
                -include build/wineserver/unicode_fix.h -include build/wineserver/wineserver_ios_kill.h \
                -DBINDIR=\"/usr/local/bin\" -DDATADIR=\"/usr/local/share\" \
                -D__WINESRC__ -DWINE_IOS=1 -Dmain=wineserver_main -Wno-implicit-function-declaration \
                -c "$f" -o "build/wineserver/obj/$name.o" || true
            done
            ar rcs build/wineserver/obj/libwineserver.a build/wineserver/obj/*.o
            cp build/wineserver/obj/libwineserver.a app/Madeira/libwineserver.a
          fi

          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh all
          ls -la app/Madeira/libwineserver.a

      - name: Build ntdll Unix Library for iOS
        run: |
          chmod +x build/ntdll-unix/build.sh
          chmod +x build/crypto-unix/gen_gnutls_symtab.sh
          ./build/ntdll-unix/build.sh
          ls -la app/Madeira/libntdll_unix.a

      - name: Build win32u Unix Library for iOS
        run: |
          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh
          ls -la app/Madeira/libwin32u_unix.a

      - name: Build FEXCore Static Libraries for iOS
        run: |
          chmod +x build/fex-ios/build.sh
          ./build/fex-ios/build.sh
          ls -la FEX/build-ios/FEXCore/Source/libFEXCore*.a

      - name: Build DXMT Unix & Combine with LLVM Static Libraries
        run: |
          chmod +x build/dxmt-ios/build.sh
          ./build/dxmt-ios/build.sh || true
          
          # Combine DXMT objects / libdxmt_unix.a with LLVM iOS libraries into libdxmt_combined.a
          mkdir -p build/dxmt-ios/obj
          if [ -f "build/dxmt-ios/libdxmt_unix.a" ]; then
            xcrun -sdk iphoneos libtool -static -o app/Madeira/libdxmt_combined.a \
              build/dxmt-ios/libdxmt_unix.a toolchains/llvm-ios-build/lib/*.a
          elif [ -f "app/libdxmt_unix.a" ]; then
            xcrun -sdk iphoneos libtool -static -o app/Madeira/libdxmt_combined.a \
              app/libdxmt_unix.a toolchains/llvm-ios-build/lib/*.a
          fi
          ls -la app/Madeira/libdxmt_combined.a

      - name: Build Madeira App via xcodebuild
        run: |
          CONFIG="${{ inputs.build_configuration || 'Debug' }}"
          echo "Building configuration: $CONFIG"

          xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p ipa_build/Payload
          APP_PATH=$(find build/DerivedData -name "Madeira.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Madeira.app not found in DerivedData"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" ipa_build/Payload/
          cd ipa_build
          zip -r ../Madeira.ipa Payload
          cd ..
          ls -lh Madeira.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
          retention-days: 14

      - name: Create Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Madeira.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
